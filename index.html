<style>

main{padding:1.4rem;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}

.bars{display:flex;gap:.6rem;align-items:flex-end;height:150px}
.bars div{flex:1;text-align:center;font-size:.85rem}
.bars i{display:block;background:var(--am);border-radius:6px 6px 0 0;min-height:3px}
.rk{display:grid;grid-template-columns:90px 1fr 28px;gap:.5rem;align-items:center;margin:.35rem 0}
.rk i{display:block;height:12px;background:var(--pr);border-radius:6px}
.mut{color:var(--mut)}
.top{display:none}
@media(max-width:760px){.app{display:block}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:.2rem}nav .brand,nav small{width:100%}nav button{width:auto}}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes slideup{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translate(-50%,0)}}
.out{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--pr) 40%,#000),var(--pr),color-mix(in srgb,var(--pr) 65%,#000),color-mix(in srgb,var(--pr) 70%,#fff));background-size:300% 300%;animation:flow 14s ease infinite}
.out::before,.out::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:float 9s ease-in-out infinite}

.out .login{position:relative;z-index:1}
.out .login>.brand{color:#fff;animation:rise .7s both}.out .login>.brand b{color:var(--am)}
.out .login>p.mut{color:#cfe0ff;animation:rise .7s .1s both}
.out .card{animation:rise .7s both;box-shadow:0 18px 40px rgba(3,10,40,.35)}.out .card:nth-of-type(2){animation-delay:.15s}
.in{animation:rise .45s both}
.in .stat,.in .card{animation:pop .5s both}

.in .bars i{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}

.stat,.card,button{transition:transform .2s,box-shadow .2s,background .2s,border-color .2s}
.stat:hover,.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(23,71,209,.14)}

.toast{animation:slideup .3s both;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{background:linear-gradient(90deg,var(--ink),var(--pr));-webkit-background-clip:text;background-clip:text;color:transparent}

button{position:relative;overflow:hidden;border-radius:10px}

.tag{transition:transform .2s}.tag:hover{transform:scale(1.08)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

else if('gl' in d)R(async()=>{const now=Date.now();if(w.lock&&now<w.lock)return say('Muitas tentativas incorretas. Aguarde um minuto.');const h=await hashPw($('#wpw').value,w.acc.salt);if(h!==w.acc.hash){w.tries=(w.tries||0)+1;if(w.tries>=5){w.lock=now+60000;w.tries=0}return say('Senha incorreta.')}await enter(w.acc)});
else if('gr' in d){go();w.role=d.gr;w.step=w.role=='platform_admin'?4:3;draw()}
else if('gb' in d){go();w.step=w.step==4&&w.role=='platform_admin'?2:Math.max(1,w.step-1);draw()}
else if('gnew' in d){go();w.step=1;w.email='';w.acc=null;draw()}
else if('gf' in d)R(async()=>{const nm=$('#wnm').value.trim(),p1=$('#wpw').value,p2=$('#wp2').value;if(!nm)return say('Informe seu nome completo.');let cgm;if(w.role=='student'){cgm=$('#wcg').value.trim();if(!cgm)return say('Informe seu CGM.')}if(p1.length<8)return say('Informe uma senha com pelo menos 8 caracteres.');if(p1!==p2)return say('Informe a mesma senha nos dois campos.');if(await ST.acc(w.email))return say('Informe outro e-mail: esse já tem conta.');const school=w.role=='platform_admin'?null:w.sch;if(w.role=='student'){await openSchool(school.name);if(!D.students.some(x=>x.cgm==cgm&&norm(x.name)==norm(nm)))return say('Nome ou CGM incorreto, ou o aluno não está cadastrado neste colégio.')}const salt=newSalt(),acc={email:w.email,name:nm,role:w.role,school,salt,hash:await hashPw(p1,salt),prefs:{}};if(cgm)acc.cgm=cgm;await ST.putAcc(acc);await enter(acc)});
else if('enter' in d){go();R(async()=>{const x=FL[+d.enter],sch={name:x[1],city:x[0]+', PR',require_reason:false};await openSchool(sch.name);S.user={...S.user,role:'director',school:sch,asPlat:true};S.view='painel';draw()})}
else if('xs' in d){go();S.user={...S.user,role:'platform_admin',school:null,asPlat:false};S.view='escolas';draw()}
else if('sw' in d){go();modal('Trocar de colégio',`<p class='mut'>Escolha o colégio de destino. A direção dele vai aceitar ou recusar o seu pedido. Se aceitar, você sai deste colégio e passa a fazer parte somente do novo.</p><input id='cty' list='cl' value='Curitiba' style='width:100%' autocomplete='off'><datalist id='cl'>${PR.map(c=>`<option value='${esc(c[0])}'>`).join('')}</datalist><select id='sc'>${schOpts('Curitiba')}</select>`,'Enviar pedido',async()=>{const c=PR.find(p=>norm(p[0])==norm($('#cty').value)),n=$('#sc').value;if(!c||!n)return say('Escolha a cidade e o colégio.');if(n==school().name)return say('Escolha um colégio diferente do atual.');if((D.outReqs||[]).some(o=>o.to==n&&o.status=='pending'))return say('Você já enviou um pedido para esse colégio.');const u=S.user,r={id:'r'+Date.now(),kind:u.role,name:u.name,email:u.email,cgm:u.cgm,sid:u.sid,tid:u.tid,from:{name:school().name,city:school().city},at:new Date().toLocaleString('pt-BR'),status:'pending'};await tgt(n,['reqs'],T=>{T.reqs.push(r)});D.outReqs.push({id:r.id,to:n,status:'pending'});S.modal=null;log('Pediu troca de colégio','para '+n);say('Pedido enviado para '+n+'.')})}
else if(t.id=='add')R(async()=>{const n=$('#nn').value.trim(),c=$('#nc').value.trim();if(!n||!c)return say('Informe nome e CGM.');if(D.students.some(s=>s.cgm==c))return say('Esse CGM já está cadastrado.');const o=await ST.ix(c);if(o&&o!==school().name)return say('Este CGM pertence a um aluno do colégio '+o+'. Ele precisa pedir a troca de colégio.');if(!D.classes.length)return say('Informe uma turma: crie uma turma antes de cadastrar alunos.');D.students.push({id:'n'+Date.now(),name:n,cgm:c,cls:$('#ncl').value});log('Cadastrou aluno',n);say('Aluno cadastrado.')});
else if('pf' in d){go();const i=d.pf.indexOf(':');setPref(d.pf.slice(0,i),d.pf.slice(i+1))}
else if('mu' in d||'md' in d){go();const ids=menuFor().map(x=>x[0]),i=ids.indexOf(d.mu||d.md),j='mu' in d?i-1:i+1;if(j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]];setPref('order',ids)}}
else if('mreset' in d){go();setPref('order',[])}
else if('pw' in d)R(async()=>{const a=await ST.acc(S.user.email),p0=$('#pw0').value,p1=$('#pw1').value,p2=$('#pw2').value;if(await hashPw(p0,a.salt)!==a.hash)return say('Senha atual incorreta.');if(p1.length<8)return say('Informe uma nova senha com pelo menos 8 caracteres.');if(p1!==p2)return say('Informe a mesma senha nos dois campos.');const salt=newSalt(),hash=await hashPw(p1,salt);await ST.updAcc(a.email,{salt,hash});S.user.ph=hash;say('Senha alterada com sucesso.')})
},true);
async function initApp(){try{DB=await claude.use('db')}catch(e){DB=null}S.ready=true;draw();await restore();draw()}
initApp();

</script></body></html>
